name: Build Android APK

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --ignore-failed-sources

      - name: Generate debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Restore
        run: dotnet restore AndroidTemperatureChecker.csproj

      - name: Publish APK (Release, debug-signed)
        run: |
          dotnet publish AndroidTemperatureChecker.csproj \
            -c Release \
            -f net9.0-android \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore=$HOME/.android/debug.keystore \
            -p:AndroidSigningStorePass=android \
            -p:AndroidSigningKeyAlias=androiddebugkey \
            -p:AndroidSigningKeyPass=android \
            -o ./publish

      - name: Locate APK
        id: find_apk
        run: |
          APK_PATH=$(find ./publish -maxdepth 3 -name "*-Signed.apk" -print -quit)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find ./publish -maxdepth 3 -name "*.apk" -print -quit)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "No APK found under ./publish" >&2
            find ./publish -maxdepth 4 -type f | sed -n '1,200p'
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidTemperatureChecker-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
